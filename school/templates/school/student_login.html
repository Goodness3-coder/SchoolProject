{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Login - School Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-100 to-blue-200 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    
    <div class="flex justify-center mb-4">
      <img src="{% static 'school/images/logo.png' %}" alt="Logo" class="h-12 w-12 rounded-full shadow">
    </div>

    <h2 class="text-2xl font-bold text-center text-blue-700 mb-6">Student Login</h2>

    <!-- Context & System Error Messages -->
    {% if error %}
      <div class="bg-red-100 border border-red-200 text-red-700 px-4 py-2 rounded mb-4 text-sm text-center">
        {{ error }}
      </div>
    {% endif %}

    {% if messages %}
      {% for message in messages %}
        <div class="px-4 py-2 rounded mb-4 text-sm text-center {% if message.tags == 'error' %}bg-red-100 text-red-700 border border-red-200{% elif message.tags == 'success' %}bg-green-100 text-green-700 border border-green-200{% else %}bg-blue-100 text-blue-700 border border-blue-200{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="post" action="">
      {% csrf_token %}
      
      <div class="mb-4">
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          autocomplete="username" 
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-300 focus:border-blue-500 outline-none transition"
        >
      </div>

      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          autocomplete="current-password" 
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-300 focus:border-blue-500 outline-none transition"
        >
      </div>

      <button 
        type="submit"
        class="w-full bg-blue-600 text-white py-2.5 rounded-lg hover:bg-blue-700 transition font-semibold shadow-md"
      >
        Login
      </button>
    </form>
  </div>
</body>
</html>
