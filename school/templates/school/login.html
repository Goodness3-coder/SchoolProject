{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - School Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-green-50 via-blue-100 to-green-200 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <div class="flex justify-center mb-4">
      <img src="{% static 'school/images/logo.png' %}" alt="Logo" class="h-12 w-12 rounded-full shadow">
    </div>
    <h1 class="text-2xl font-bold text-center text-green-700 mb-6">Login</h1>

    {% if messages %}
      {% for message in messages %}
        <div class="px-4 py-2 rounded mb-4 text-sm {% if message.tags == 'error' %}bg-red-100 text-red-700 border border-red-200{% elif message.tags == 'success' %}bg-green-100 text-green-700 border border-green-200{% else %}bg-blue-100 text-blue-700 border border-blue-200{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="post" action="">
      {% csrf_token %}
      <div class="mb-4">
        <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
        <input type="text" name="username" id="username" autocomplete="username" required class="mt-1 block w-full border border-gray-300 rounded px-3 py-2 focus:ring focus:ring-green-300 focus:border-green-500 outline-none">
      </div>
      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" name="password" id="password" autocomplete="current-password" required class="mt-1 block w-full border border-gray-300 rounded px-3 py-2 focus:ring focus:ring-green-300 focus:border-green-500 outline-none">
      </div>
      <button type="submit" class="bg-green-600 hover:bg-green-700 transition text-white w-full py-2 rounded font-semibold shadow-md">Login</button>
    </form>
  </div>
</body>
</html>
