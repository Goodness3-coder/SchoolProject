{% extends 'school/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto my-10 p-8 bg-white rounded-2xl shadow-xl border border-gray-100">
  <h2 class="text-2xl font-bold text-gray-800 mb-6">Edit School Settings</h2>
  
  <form method="post" enctype="multipart/form-data" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    
    <div class="pt-4 flex gap-3">
      <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-2.5 rounded-xl transition">
        Save Settings
      </button>
      <a href="{% url 'admin_dashboard' %}" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold px-6 py-2.5 rounded-xl transition">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
