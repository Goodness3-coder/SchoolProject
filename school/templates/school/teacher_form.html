{% extends 'school/base.html' %}
{% block content %}
<form method="post" class="bg-white p-6 rounded shadow-md max-w-lg mx-auto">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded mt-4">Save</button>
  <a href="{% url 'teacher_list' %}" class="ml-4 text-gray-600 hover:underline">Cancel</a>
</form>
{% endblock %}
