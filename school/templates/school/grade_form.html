{% extends 'school/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto mt-10 bg-white p-8 rounded shadow">
  <h2 class="text-2xl font-bold text-green-700 mb-6">Add / Edit Grade</h2>
  
  <form method="post" class="space-y-4">
    {% csrf_token %}

    {% for field in form %}
      <div>
        <label for="{{ field.id_for_label }}" class="block text-gray-700 font-medium mb-1">
          {{ field.label }}
        </label>
        {{ field }}
        {% if field.errors %}
          <p class="text-red-500 text-sm mt-1">{{ field.errors.0 }}</p>
        {% endif %}
      </div>
    {% endfor %}

    <div class="mt-6">
      <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded">
        Save
      </button>
      <a href="{% url 'grade_list' %}" class="ml-4 text-gray-600 hover:underline">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
