{% extends 'school/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto mt-10 bg-white p-6 rounded-2xl shadow-lg">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Add / Edit Timetable</h2>

    <form method="post" class="space-y-6">
        {% csrf_token %}
        
        <!-- Render fields -->
        {% for field in form %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <p class="text-red-500 text-xs mt-1">{{ field.errors|join:", " }}</p>
                {% endif %}
            </div>
        {% endfor %}

        <!-- Buttons -->
        <div class="flex justify-between items-center mt-6">
            <a href="{% url 'timetable_list' %}" 
               class="px-4 py-2 bg-gray-500 hover:bg-gray-600 text-white rounded-lg">
               Cancel
            </a>
            <button type="submit" 
                    class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg">
                Save
            </button>
        </div>
    </form>
</div>
{% endblock %}
