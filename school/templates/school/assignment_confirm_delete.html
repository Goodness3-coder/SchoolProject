{% extends 'school/base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded shadow">
  <p class="mb-4 text-lg">
    Delete assignment for <strong>{{ assignment.subject.name }}</strong> in <strong>{{ assignment.classroom.name }}</strong>?
  </p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded">Yes, delete</button>
    <a href="{% url 'assignment_list' %}" class="ml-4 text-gray-600 hover:underline">Cancel</a>
  </form>
</div>
{% endblock %}
